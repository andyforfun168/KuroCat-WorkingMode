name: Apply reviewed integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'andyforfun168/KuroCatAndy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified selected v1.3.8 interactions and fixes
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/integration-fork-v138.patch" > /tmp/reviewed.patch
          echo "f6584b5c0d2a7e8a34e693924229ed6abb0aeddcf091dbda7caacd971294c95e  /tmp/reviewed.patch" | sha256sum --check
          git switch --detach "$GITHUB_SHA"
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          git rm scripts/integration-fork-v138.patch
          git diff --cached --check
          TREE=$(git write-tree)
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          COMMIT=$(git commit-tree "$TREE" -p "$GITHUB_SHA" -m "Release v1.3.8 with selected keyboard, tail and input fixes")
          git push origin "$COMMIT:refs/heads/main"
          echo "Updated main to $COMMIT" >> "$GITHUB_STEP_SUMMARY"
