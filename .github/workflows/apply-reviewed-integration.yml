name: Apply reviewed integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'andyforfun168/KuroCatAndy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified v1.4.1 features and preserved skin artwork
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/integration-fork-v141.patch" > /tmp/reviewed.patch
          echo "42fe83132f30f3c36d06d0587b0223c6f8930c188d7f49e88b9c0550012fa0e1  /tmp/reviewed.patch" | sha256sum --check
          git switch --detach "$GITHUB_SHA"
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          git rm scripts/integration-fork-v141.patch
          git diff --cached --check
          TREE=$(git write-tree)
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          COMMIT=$(git commit-tree "$TREE" -p "$GITHUB_SHA" -m "Release v1.4.1 with upstream features and approved pure-white arms")
          git push origin "$COMMIT:refs/heads/main"
          echo "Updated main to $COMMIT" >> "$GITHUB_STEP_SUMMARY"
