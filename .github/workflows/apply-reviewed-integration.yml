name: Apply reviewed integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'andyforfun168/KuroCatAndy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate approved v1.4.2 release source
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/integration-fork-v142.patch" > /tmp/reviewed.patch
          echo "64e4541fce9d4714b3f554dc7c8556a1c311dcb927a0d7edd8c9d24b9447551e  /tmp/reviewed.patch" | sha256sum --check
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          git rm scripts/integration-fork-v142.patch
          git diff --cached --check
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git commit -m "Integrate upstream v1.4.1 and approved tail/skin fixes for v1.4.2 [skip ci]"
          git push origin HEAD:main
  upstream-skins:
    needs: apply
    if: github.repository == 'andyforfun168/KuroCatAndy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare isolated skin and tail repair branch
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/upstream-skins-tail-v142.patch" > /tmp/skins.patch
          echo "22717bf8aef760925f9487786d5e4602820f8f9651033b5e313d5ce528e3ad93  /tmp/skins.patch" | sha256sum --check
          git fetch https://github.com/chanke17/KuroCat.git 412bc3889462c1234285f35df1fc20a5ad5b76a2
          git switch --detach FETCH_HEAD
          git apply --check /tmp/skins.patch
          git apply --index /tmp/skins.patch
          git diff --cached --check
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git commit -m "Fix curled tail seam and preserve white forelegs on bicolor coats"
          git push origin HEAD:refs/heads/codex/white-arms-tail-root-v141
