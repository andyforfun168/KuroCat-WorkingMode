name: Build KuroCat (macOS, Windows & Linux/UOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Build and prepare a draft release from this commit
        type: boolean
        default: false
      release_version:
        description: Numeric version without v (used for manual releases)
        type: string
        default: '1.3.6'

env:
  RELEASE_VERSION: ${{ inputs.release_version || '1.3.6' }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build standalone KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          if not exist KuroCat.exe exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Windows-x64
          path: windows/KuroCat.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check coat artwork and action regressions
        run: bash scripts/check-skins.sh
      - name: Check eye closure pixel regression
        run: bash scripts/check-eye-closure.sh
      - name: Set release bundle version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.prepare_release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${RELEASE_TAG#v}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Resources/Info.plist
      - name: Build and verify Universal app (Apple Silicon + Intel)
        run: |
          ./build.sh
          lipo KuroCat.app/Contents/MacOS/KuroCat -verify_arch arm64
          lipo KuroCat.app/Contents/MacOS/KuroCat -verify_arch x86_64
          codesign --verify --deep --strict KuroCat.app
          cp LICENSE KuroCat.app/Contents/Resources/LICENSE
          # Re-sign after adding the license to the application bundle.
          codesign --force --deep --sign - KuroCat.app
          codesign --verify --deep --strict KuroCat.app
          ditto -c -k --sequesterRsrc --keepParent KuroCat.app KuroCat-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-macOS-universal
          path: KuroCat-macOS-universal.zip
          if-no-files-found: error

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: arm64
    runs-on: ${{ matrix.runner }}
    # Build inside Debian 10 "buster" (glibc 2.28, GTK 3.24, GCC 8). The previous Ubuntu 22.04
    # image produced binaries needing glibc 2.34+, which 统信 UOS 20 (glibc 2.28) and 银河麒麟 V10
    # (glibc 2.31) cannot run — on Kylin that showed up as "installation always fails".
    # The container is started with `docker run` (not `container:`) so actions/checkout's Node
    # runtime never has to run on the old glibc.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KuroCat Linux binary, .deb and .tar.gz in Debian 10 (glibc 2.28)
        shell: bash
        run: |
          DEB_VER="$RELEASE_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then DEB_VER="${GITHUB_REF_NAME#v}"; fi
          [[ "$DEB_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker run --rm -v "$PWD":/src -w /src \
            -e DEB_VER="$DEB_VER" -e TAR_ARCH="${{ matrix.tar_arch }}" -e KUROCAT_MAX_GLIBC=2.28 \
            debian:buster bash -euo pipefail -c '
              # buster is archived: point apt at archive.debian.org
              sed -i -e "s|deb.debian.org|archive.debian.org|g" \
                     -e "s|security.debian.org|archive.debian.org|g" \
                     -e "/buster-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev dpkg-dev binutils file ca-certificates
              cd linux
              chmod +x build.sh build_deb.sh install.sh uninstall.sh
              ./build.sh
              ./build_deb.sh "$DEB_VER"
              ldd kurocat > dependencies.txt
              ! grep -q "not found" dependencies.txt
              cp ../LICENSE LICENSE
              cp ../docs/DOWNLOADS.md INSTALL.txt
              tar -czf "KuroCat-Linux-${TAR_ARCH}.tar.gz" \
                kurocat kurocat.desktop kurocat.svg install.sh uninstall.sh 安装说明.txt LICENSE INSTALL.txt
            '
          sudo chown -R "$(id -u):$(id -g)" linux
          ls -lh "linux/KuroCat-Linux-${{ matrix.arch }}.deb" "linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Linux-${{ matrix.arch }}
          path: |
            linux/KuroCat-Linux-${{ matrix.arch }}.deb
            linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz

  release:
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.prepare_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an existing published release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > published-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" published-tags.txt; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release already published; preserving its notes and assets."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release-state.outputs.published != 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Validate release assets and generate checksums
        if: steps.release-state.outputs.published != 'true'
        run: |
          mv dist/KuroCat.exe dist/KuroCat-Windows-x64.exe
          bash scripts/verify-release.sh dist
          test -s "docs/releases/${RELEASE_TAG}.md"
          cp LICENSE dist/LICENSE.txt
      - name: Prepare complete draft release
        if: steps.release-state.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: KuroCat ${{ env.RELEASE_TAG }} · macOS / Windows / Linux
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/KuroCat-macOS-universal.zip
            dist/KuroCat-Windows-x64.exe
            dist/KuroCat-Linux-amd64.deb
            dist/KuroCat-Linux-x86_64.tar.gz
            dist/KuroCat-Linux-arm64.deb
            dist/KuroCat-Linux-arm64.tar.gz
            dist/SHA256SUMS.txt
            dist/LICENSE.txt
