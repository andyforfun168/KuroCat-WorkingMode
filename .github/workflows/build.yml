name: Build KuroCat (macOS, Windows & Linux/UOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build standalone KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          if not exist KuroCat.exe exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Windows-x64
          path: windows/KuroCat.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Resources/Info.plist
      - name: Build and verify Universal app (Apple Silicon + Intel)
        run: |
          ./build.sh
          lipo -verify_arch arm64 x86_64 KuroCat.app/Contents/MacOS/KuroCat
          codesign --verify --deep --strict KuroCat.app
          cp LICENSE KuroCat.app/Contents/Resources/LICENSE
          # Re-sign after adding the license to the application bundle.
          codesign --force --deep --sign - KuroCat.app
          codesign --verify --deep --strict KuroCat.app
          ditto -c -k --sequesterRsrc --keepParent KuroCat.app KuroCat-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-macOS-universal
          path: KuroCat-macOS-universal.zip
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            tar_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: arm64
    runs-on: ${{ matrix.runner }}
    # Prebuilt Linux packages target Ubuntu 22.04 / glibc 2.35 and newer.
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev dpkg-dev ca-certificates git file
      - uses: actions/checkout@v4
      - name: Build and package Linux binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION=1.2.0
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION="${RELEASE_TAG#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          cd linux
          ./build.sh
          ./build_deb.sh "$VERSION"
          test "$(dpkg-deb -f KuroCat-Linux-${{ matrix.arch }}.deb Architecture)" = '${{ matrix.arch }}'
          ldd kurocat | tee dependencies.txt
          ! grep -q 'not found' dependencies.txt
          file kurocat
          cp ../LICENSE LICENSE
          cp ../docs/DOWNLOADS.md INSTALL.txt
          tar -czf KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz kurocat kurocat.desktop kurocat.svg LICENSE INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Linux-${{ matrix.arch }}
          path: |
            linux/KuroCat-Linux-${{ matrix.arch }}.deb
            linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate release assets and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv dist/KuroCat.exe dist/KuroCat-Windows-x64.exe
          bash scripts/verify-release.sh dist
          test -s "docs/releases/${RELEASE_TAG}.md"
          cp LICENSE dist/LICENSE.txt
      - name: Prepare complete draft release
        uses: softprops/action-gh-release@v2
        with:
          name: KuroCat ${{ github.ref_name }} · macOS / Windows / Linux
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/KuroCat-macOS-universal.zip
            dist/KuroCat-Windows-x64.exe
            dist/KuroCat-Linux-amd64.deb
            dist/KuroCat-Linux-x86_64.tar.gz
            dist/KuroCat-Linux-arm64.deb
            dist/KuroCat-Linux-arm64.tar.gz
            dist/SHA256SUMS.txt
            dist/LICENSE.txt
